# Render blueprint: one free web service running the verifier.
# Set the secret values in the Render dashboard after the first deploy.
services:
  - type: web
    name: legwork-verifier
    runtime: docker
    plan: free
    rootDir: verifier
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: CLUSTER
        value: devnet
      - key: RPC_URL
        value: https://api.devnet.solana.com
      - key: PROGRAM_ID
        value: 86V9Vw6jPnoy4R6feJK6atwMK3x1oUootvvbqb8iZHD6
      - key: USDC_MINT
        value: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: IDENTITY_DOMAIN
        value: legwork.app
      - key: VERIFIER_KEYPAIR
        sync: false   # JSON array of the verifier keypair
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CREATOR_NAMES
        value: '{"FCMKYnQ49htyR6HUQYA6UHZsCdrGQuUBNd1r4DfMRGeT": {"name": "Legwork Launch Campaign", "verified": true}}'
